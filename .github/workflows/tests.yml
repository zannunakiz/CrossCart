name: TESTS

on:
  push:
  pull_request:

# Build-time placeholders only: no job below ever connects to a database
# (tests are pure mocks), but Next.js reads these keys while compiling.
env:
  DATABASE_URI: "postgres://postgres:postgres@localhost:5432/crosscart"
  NEXTAUTH_SECRET: "ci-build-placeholder-secret"
  NEXTAUTH_URL: "http://localhost:3000"

# Four independent jobs → four separate status checks that can each be required
# on their own in branch protection and re-run individually:
#
#   TESTS / lint        → npm run lint
#   TESTS / build       → npm run build
#   TESTS / unit test   → npm run test:unit
#   TESTS / RBAC test   → npm run test:rbac
#
# These used to be four steps of a single job ("TESTS / TESTS"), where the run
# stopped at the first failing step so the remaining checks never reported a
# result. Every job now owns its own runner and reports green/red on its own.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: build
        run: npm run build

  unit-test:
    name: unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: unit test
        run: npm run test:unit

  rbac-test:
    name: RBAC test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: RBAC test
        run: npm run test:rbac
